# Intégration continue : vérifications complètes (typecheck, lint, tests, build) puis e2e Playwright.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Une nouvelle exécution sur la même branche ou la même PR annule la précédente, devenue obsolète.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node 22
        uses: actions/setup-node@v7
        with:
          # '22' = dernière 22.x, conforme à engines.node (>= 22.12.0).
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Typecheck, lint, tests unitaires, build
        run: npm run check

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests e2e
        run: npm run e2e

      - name: Déposer les résultats Playwright (échec seulement)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
